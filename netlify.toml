[build]
  command = "npm --prefix backend install && npm --prefix frontend install && npm --prefix frontend run build"
  publish = "frontend/dist"
  functions = "backend/netlify/functions"

[functions]
  external_node_modules = ["express", "pdfkit"]
  node_bundler = "esbuild"

[functions.api]
  included_files = ["backend/node_modules/pdfkit/js/data/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200